{% extends "base.html" %}
{% block title %}Adopt a Pet{% endblock %}
{% block content %}
<section class="auth-layout"><div class="page-heading"><p class="eyebrow">MAKE IT OFFICIAL</p><h1>Adopt This Pet</h1></div>
    <div class="form-container">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="post" action="/pets/adopt_pet/{{ pet['avatar'] }}">
            <label class="field-label">Your New Pet’s Name<input type="text" name="name" placeholder="Your New Pet's Name" required autofocus></label>
            <label class="field-label">Password<input type="password" name="password" placeholder="Password" required></label>
            <label class="field-label">Confirm Password<input type="password" name="confirm_password" placeholder="Confirm Password" required></label>
            <button type="submit">Adopt</button>
        </form>
    </div></section>
{% endblock %}
