<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NewsMuncher{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="wordmark">NEWS<span>MUNCHER</span><i aria-hidden="true">✳</i></div>
    <span class="edition">Fresh nonsense. Daily.</span>
  </header>
  <main id="main-content" class="site-main">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>NEWSMUNCHER</span><span>A little rough around the edges.</span></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
