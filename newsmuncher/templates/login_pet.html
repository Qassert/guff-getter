<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to {{ pet["name"] }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 20px;
        }

        .form-container {
            background-color: #111;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            max-width: 400px;
            width: 100%;
        }

        .error-message {
            color: #ff0066;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 5px #ff0066;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #222;
            border: 1px solid #00ffff;
            border-radius: 5px;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
        }
    </style>
</head>
<body>
    <h2>Log in to {{ pet["name"] }}</h2>
    <div class="form-container">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="post" action="/pets/use_pet/{{ pet['avatar'] }}">
            <input type="password" name="password" placeholder="Password" required autofocus>
            <button type="submit">Enter</button>
        </form>
    </div>
</body>
</html>
