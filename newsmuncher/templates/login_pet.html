{% extends "base.html" %}
{% block title %}Login to {{ pet["name"] }}{% endblock %}
{% block content %}
<section class="auth-layout"><div class="page-heading"><p class="eyebrow">BACK FOR MORE</p><h1>Log in to {{ pet["name"] }}</h1></div>
    <div class="form-container">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="post" action="/pets/use_pet/{{ pet['avatar'] }}">
            <label class="field-label">Password<input type="password" name="password" placeholder="Password" required autofocus></label>
            <button type="submit">Enter</button>
        </form>
    </div></section>
{% endblock %}
