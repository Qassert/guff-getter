{% extends "base.html" %}
{% block title %}Pet Profile{% endblock %}
{% block header %}{% endblock %}
{% block body_attributes %} class="profile-page"{% endblock %}
{% block background %}
<div id="initialBackground" class="initial-background" aria-hidden="true"></div>
<div id="generatedBackdrop" class="generated-backdrop" aria-hidden="true"><div></div><div></div></div>
{% endblock %}
{% block content %}
<div id="imageAmbient" class="image-ambient" aria-hidden="true"><div class="wash-group"><span></span><span></span></div><div class="wash-group"><span></span><span></span></div></div>
<div class="workshop">


  <div class="container profile-container">
  <div class="container nonsense-container" role="group" aria-label="Source selection">
    <button type="button" class="funky-button source-choice" data-source="fetch_historicalFunny_from_api" aria-pressed="false" onclick="fetchAndDisplay('fetch_historicalFunny_from_api')">DRIVEL</button>
    <button type="button" class="funky-button source-choice" data-source="fetch_wikipedia_into_api" aria-pressed="false" onclick="fetchAndDisplay('fetch_wikipedia_into_api')">WIKIPEDIA</button>
    <button type="button" class="funky-button source-choice" data-source="fetch_poem_into_api" aria-pressed="false" onclick="fetchAndDisplay('fetch_poem_into_api')">POEM</button>
    <button type="button" class="funky-button source-choice" data-source="fetch_people_into_api" aria-pressed="false" onclick="fetchAndDisplay('fetch_people_into_api')">PEOPLE</button>
  </div>
    <div id="loader" class="spinner hidden"></div>
    <input type="hidden" id="titleDescBox">
    <button type="button" id="sourceEdit" class="funky-button edit-tab" aria-label="Edit source" aria-controls="sourceEditor" aria-expanded="false" onclick="profileEditing.edit('source')">EDIT</button>
    <div id="sourceDisplay" class="section-display">
      <h2 id="sourceTitleHeading" class="result-heading"></h2>
      <textarea aria-label="Source body" id="nonsenseBox" readonly></textarea>
    </div>
    <div id="sourceEditor" class="section-editor" hidden>
      <textarea id="sourceTitleDraft" class="headline-editor" rows="1" aria-label="Source title" oninput="autoResize(this)"></textarea>
      <textarea id="sourceBodyDraft" aria-label="Source body" oninput="autoResize(this)"></textarea>
      <div class="edit-actions" role="group" aria-label="Source editing">
        <button type="button" class="funky-button" onclick="profileEditing.save('source')">SAVE</button>
        <button type="button" class="funky-button" onclick="profileEditing.cancel('source')">CANCEL</button>
      </div>
    </div>
<div class="generation-controls">
    <label class="image-toggle">
      <input type="checkbox" id="generateImages" autocomplete="off">
      <span class="funky-button">IMAGE GENERATION MODE</span>
    </label>
    <button class="funky-button shizzle-button" onclick="confirmData()">SHIZZALISE</button>
  </div>
  </div>




  <div id="outputContainer" class="container hidden">
    <button type="button" id="responseEdit" class="funky-button edit-tab" aria-label="Edit response" aria-controls="responseEditor" aria-expanded="false" onclick="profileEditing.edit('response')">EDIT</button>
    <div id="responseDisplay" class="section-display">
      <h2 id="crazyTitleBox" class="result-heading"></h2>
      <textarea aria-label="Response body" id="crazyExtractBox" readonly></textarea>
    </div>
    <div id="responseEditor" class="section-editor" hidden>
      <textarea id="responseTitleDraft" class="headline-editor" rows="1" aria-label="Response title" oninput="autoResize(this)"></textarea>
      <textarea id="responseBodyDraft" aria-label="Response body" oninput="autoResize(this)"></textarea>
      <div class="edit-actions" role="group" aria-label="Response editing">
        <button type="button" class="funky-button" onclick="profileEditing.save('response')">SAVE</button>
        <button type="button" class="funky-button" onclick="profileEditing.cancel('response')">CANCEL</button>
      </div>
    </div>
    <div id="imagePanel" class="image-panel hidden" aria-live="polite"></div>
    <div id="jingleControls" class="jingle-controls" hidden>
      <div class="jingle-buttons">
        <button type="button" id="jingleButton" class="funky-button" onclick="jingleUI.act()" disabled>MAKE JINGLE</button>
        <button type="button" id="jingleStop" class="funky-button" onclick="jingleUI.stop()" hidden>■ STOP</button>
      </div>
      <p id="jingleMessage" role="status" aria-live="polite"></p>
    </div>
  <button id="bankButton" class="funky-button shizzle-button hidden" onclick="bankThisBeauty()">NOMINATE</button>
  </div>




</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='jingles.js') }}"></script><script src="{{ url_for('static', path='profile-editing.js') }}"></script><script src="{{ url_for('static', path='image-background.js') }}"></script><script src="{{ url_for('static', path='image-colors.js') }}"></script><script src="{{ url_for('static', path='script.js') }}"></script>{% endblock %}
